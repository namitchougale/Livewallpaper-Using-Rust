[package]
name = "flow-live-wallpaper"
version = "1.2.0"
edition = "2021"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading",
    "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Registry",
    "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_SystemServices",
    "Win32_System_RemoteDesktop",
    "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = "1"

[profile.release]
strip = true
lto = true
